<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:* https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
  <title>AI MultiChat Desktop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #2563eb 100%, #1e40af 0%);
      color: #fff;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container { text-align: center; padding: 40px; max-width: 440px; }
    .logo {
      width: 88px; height: 88px; margin: 0 auto 24px;
      background: #ffffff; border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 16px 36px rgba(0,0,0,0.25);
    }
    .bubble { width: 48px; height: 48px; position: relative; }
    .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #2563eb; position: absolute; top: 18px;
    }
    .dot.d1 { left: 4px; }
    .dot.d2 { left: 19px; }
    .dot.d3 { left: 34px; }
    h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
    p.sub { font-size: 15px; opacity: 0.8; margin-bottom: 24px; }
    .spinner {
      width: 32px; height: 32px; margin: 20px auto;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 16px; border-radius: 12px; margin-top: 16px;
      display: none;
    }
    .error-box p { font-size: 14px; margin-bottom: 12px; }
    .btn {
      display: inline-block; padding: 10px 24px;
      background: #ffffff; color: #1e40af; border-radius: 10px;
      text-decoration: none; font-weight: 600; font-size: 14px;
      border: none; cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.15);
      transition: transform 0.1s ease;
    }
    .btn:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="container" id="loading-view">
    <div class="logo">
      <div class="bubble">
        <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
      </div>
    </div>
    <h1>AI MultiChat</h1>
    <p class="sub">Forbinder til server...</p>
    <div class="spinner" id="spinner"></div>
    <div class="error-box" id="error-box">
      <p>Kunne ikke oprette forbindelse til serveren.</p>
      <button class="btn" id="retry-btn">Prøv igen</button>
    </div>
  </div>

  <script>
    // Konfigurerbar server URL (kan ændres i build eller config)
    const MULTICHAT_URL = "http://localhost:8000/chat?embed=companion&client=companion";
    const PING_TIMEOUT = 5000;

    function connect() {
      const errorBox = document.getElementById("error-box");
      const spinner = document.getElementById("spinner");
      const subText = document.querySelector(".sub");

      errorBox.style.display = "none";
      spinner.style.display = "block";
      subText.textContent = "Forbinder til server...";

      // Prøv at navigere direkte eller tjek forbindelsen
      const timer = setTimeout(() => {
        spinner.style.display = "none";
        errorBox.style.display = "block";
        subText.textContent = "Forbindelsesfejl";
      }, PING_TIMEOUT);

      // Forsøg at loade URL
      window.location.replace(MULTICHAT_URL);
    }

    document.getElementById("retry-btn").addEventListener("click", connect);

    // Start ved opstart
    window.addEventListener("DOMContentLoaded", () => {
      setTimeout(connect, 400);
    });
  </script>
</body>
</html>
