<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eira Companion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f8fafc;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Loading State */
        #loadingState {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loadingState p {
            color: #64748b;
            font-size: 14px;
        }

        /* Error State */
        #errorState {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            background: #fef2f2;
            width: 100%;
            height: 100%;
        }

        #errorState .icon {
            font-size: 56px;
            margin-bottom: 16px;
        }

        #errorState h1 {
            color: #1e293b;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        #errorState p {
            color: #64748b;
            font-size: 14px;
            max-width: 360px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        #errorState .retry-btn {
            padding: 10px 32px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        #errorState .retry-btn:hover {
            background: #1e40af;
        }

        /* Offline Badge */
        #offlineBadge {
            display: none;
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: #ef4444;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
            z-index: 9999;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Loading State -->
    <div id="loadingState">
        <div class="spinner"></div>
        <p>Forbinder til Eira Companion...</p>
    </div>

    <!-- Error State -->
    <div id="errorState">
        <div class="icon">🔌</div>
        <h1>Ingen forbindelse</h1>
        <p>
            Kunne ikke oprette forbindelse til Eira-serveren.<br />
            Kontroller din internetforbindelse og prøv igen.
        </p>
        <button id="retryBtn" class="retry-btn">Prøv igen</button>
    </div>

    <!-- Offline Badge -->
    <div id="offlineBadge">📡 Offline</div>

    <script type="module">
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const offlineBadge = document.getElementById('offlineBadge');
        const retryBtn = document.getElementById('retryBtn');

        let isOnline = navigator.onLine;

        async function getServerUrl() {
            if (window.__TAURI__ && window.__TAURI__.core) {
                try {
                    const url = await window.__TAURI__.core.invoke('get_server_url');
                    if (url) return url;
                } catch (error) {
                    console.error('Failed to get server URL from Tauri backend:', error);
                }
            }
            return 'https://aichat.wm-group.dk';
        }

        async function initCompanion() {
            try {
                const serverUrl = await getServerUrl();
                const targetUrl = `${serverUrl}/chat?embed=companion&sso=1&client=companion`;
                
                // Directly navigate main webview to targetUrl (bypasses iframe framing restrictions completely)
                window.location.href = targetUrl;
            } catch (error) {
                console.error('Failed to initialize companion:', error);
                loadingState.style.display = 'none';
                errorState.style.display = 'flex';
            }
        }

        function retryConnection() {
            loadingState.style.display = 'flex';
            errorState.style.display = 'none';
            initCompanion();
        }

        retryBtn.addEventListener('click', retryConnection);

        function updateOnlineStatus() {
            isOnline = navigator.onLine;
            if (isOnline) {
                offlineBadge.style.display = 'none';
                if (errorState.style.display === 'flex') {
                    retryConnection();
                }
            } else {
                offlineBadge.style.display = 'block';
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(initCompanion, 200);
        });
    </script>
</body>
</html>
