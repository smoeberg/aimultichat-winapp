name: Build Eira Companion WinApp

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      - name: Rust stable
        uses: dtolnay/rust-action@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo & tauri dependencies
        uses: Swatinem/rust-cache@v2

      - name: Quality Gate (Format & Clippy & Tests)
        run: |
          cargo fmt -- --check
          cargo clippy -- -D warnings
          cargo test

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "."
          tagName: __TAURI_METADATA__
          releaseName: "Eira Companion __TAURI_METADATA__"
          releaseBody: "Automated Windows build for Eira Companion desktop client."
          draft: true
          prerelease: false
