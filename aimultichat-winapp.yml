name: Build AIMultiChat WinApp

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          prefix-key: "winapp"
          workspaces: "./winapp"

      - name: Build Tauri WinApp
        uses: tauri-apps/tauri-action@v0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./winapp"
          tagName: __TAURI_REV__
          releaseName: 'AIMultiChat WinApp v__VERSION__'
          releaseBody: 'Automatic build of AIMultiChat Windows Desktop Client.'
          releaseDraft: false
          pruneGeneratedAssets: true
